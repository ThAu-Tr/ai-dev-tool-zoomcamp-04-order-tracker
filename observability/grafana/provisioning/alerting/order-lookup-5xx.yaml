apiVersion: 1

groups:
  - orgId: 1
    name: order-tracker-alerts
    folder: Order Tracker
    interval: 10s
    rules:
      - uid: order-lookup-5xx
        title: Order lookup server errors
        condition: B
        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: sum(increase(order_lookup_requests_total{http_response_status_code=~"5.."}[5m]))
              intervalMs: 1000
              maxDataPoints: 43200
              range: true
              refId: A
          - refId: B
            queryType: ""
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: classic_conditions
        dashboardUid: order-tracker-requests
        panelId: 2
        noDataState: OK
        execErrState: Alerting
        for: 0s
        annotations:
          summary: 5xx response(s) recorded for an order lookup.
          endpoint: /api/orders/{order_id}
          time_window: 5 minutes
          dashboard_url: http://localhost:3000/d/order-tracker-requests/order-tracker-requests?viewPanel=2
          __dashboardUid__: order-tracker-requests
          __panelId__: "2"
        labels:
          severity: warning
          service: order-tracker
